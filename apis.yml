aid: cheerfy
name: Cheerfy
description: >-
  Cheerfy is a customer-engagement and digital-experience platform for restaurants and hospitality
  brands, bringing CRM and loyalty, online ordering, pay-at-table, self-service kiosks, and a
  multi-brand marketplace together in a single platform. It centralizes customer data from POS,
  bookings, Wi-Fi and payment systems, then drives automated SMS, email and push marketing, branded
  loyalty cards and wallet-ready digital coupons, feedback surveys, and real-time analytics. Cheerfy
  serves 200+ restaurant brands and publishes developer documentation for its Loyalty Card and
  Coupons APIs. Backed by Techstars, it was added to the API Evangelist network from a Techstars
  portfolio lead and enriched from its public developer surface.

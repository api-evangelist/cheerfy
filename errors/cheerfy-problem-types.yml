note: >-
  Cheerfy publishes no error reference, and there is no OpenAPI to derive 4xx/5xx responses from.
  This catalog records the error shapes actually observed on the live hosts. The envelope is the
  Django REST Framework default — a JSON object with a single "detail" string — not RFC 9457
  problem+json: responses carry Content-Type application/json, and no type, title, status or
  instance members.
envelope:
